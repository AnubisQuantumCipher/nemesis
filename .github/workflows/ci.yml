name: CI

on:
  push:
    branches:
      - main
      - "build/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-evidence:
    name: Contract and evidence
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verify architect contracts
        run: |
          python3 scripts/verify_contract.py
          python3 scripts/verify_production_contract.py
          python3 scripts/verify_release_contract.py
      - name: Verify committed evidence bundles
        run: |
          python3 scripts/verify_evidence_bundle.py receipts/phase-6
          python3 scripts/verify_evidence_bundle.py receipts/phase-7-desktop
          python3 scripts/verify_evidence_bundle.py receipts/phase-11
      - name: Run repository and release regressions
        run: |
          python3 -m unittest \
            tests.phase0.test_phase0 \
            tests.phase0.test_tcb_budget \
            tests.phase0.test_production_contract \
            tests.phase0.test_kernel_proof_manifest \
            tests.integration.test_evidence_bundle \
            tests.integration.test_phase16_receipt_generation \
            tests.integration.test_phase16_public_verification \
            tests.integration.test_release_bundle \
            tests.integration.test_release_leaks \
            tests.integration.test_release_manifest \
            tests.integration.test_release_runtime \
            tests.integration.test_macho_sanitizer \
            tests.integration.test_production_readiness \
            tests.integration.test_third_party_notices \
            -v

  rust-desktop:
    name: Rust and Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.94.0 --profile minimal --component rustfmt
          rustup default 1.94.0
      - name: Install desktop dependencies
        run: npm --prefix desktop ci
      - name: Test and build renderer
        run: |
          npm --prefix desktop test
          npm --prefix desktop run build
      - name: Check and test Rust runtime
        run: |
          cargo fmt --manifest-path runtime/Cargo.toml --all -- --check
          cargo test --manifest-path runtime/Cargo.toml --workspace
      - name: Check and test native desktop bridge
        run: |
          cargo fmt --manifest-path desktop/src-tauri/Cargo.toml -- --check
          cargo test --manifest-path desktop/src-tauri/Cargo.toml

  dependency-audit:
    name: Dependency audit
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install pinned Rust and audit tools
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          rustup default 1.94.0
          cargo install cargo-audit --version 0.22.1 --locked
          cargo install cargo-about --version 0.9.2 --locked --features cli
      - name: Audit locked dependencies
        run: |
          npm --prefix desktop ci
          cargo audit --file runtime/Cargo.lock
          cargo audit --file desktop/src-tauri/Cargo.lock
          npm --prefix desktop audit
          mkdir -p /tmp/nemesis-licenses
          cargo about generate \
            --manifest-path runtime/Cargo.toml \
            --workspace \
            --config runtime/about.toml \
            --format json \
            --output-file /tmp/nemesis-licenses/runtime.json \
            --locked \
            --fail
          cargo about generate \
            --manifest-path desktop/src-tauri/Cargo.toml \
            --config runtime/about.toml \
            --format json \
            --output-file /tmp/nemesis-licenses/desktop.json \
            --locked \
            --fail
          python3 scripts/generate_third_party_notices.py \
            --cargo-json /tmp/nemesis-licenses/runtime.json \
            --cargo-json /tmp/nemesis-licenses/desktop.json \
            --desktop desktop \
            --output /tmp/nemesis-licenses/THIRD_PARTY_NOTICES.txt
