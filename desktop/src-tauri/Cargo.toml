[package]
name = "nemesis-desktop"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
authors = ["AnubisQuantumCipher"]
rust-version = "1.94"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hex = "0.4"
libc = "0.2"
nemesis-protocol = { path = "../../runtime/crates/nemesis-protocol" }
nemesis-runtime = { path = "../../runtime/crates/nemesis-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }

[workspace]
