[workspace]
resolver = "2"
members = [
  "crates/nemesis-protocol",
  "crates/nemesis-runtime",
  "crates/nemesis-deterministic-worker",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["AnubisQuantumCipher"]
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tempfile = "3.20"
