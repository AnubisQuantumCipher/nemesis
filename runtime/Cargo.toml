[workspace]
resolver = "2"
members = [
  "crates/nemesis-protocol",
  "crates/nemesis-runtime",
  "crates/nemesis-deterministic-worker",
  "crates/nemesis-receipt",
  "crates/nemesis-signer",
  "crates/nemesis-verify",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["AnubisQuantumCipher"]
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tempfile = "3.20"
ed25519-dalek = "2.1"
hex = "0.4"
sha2 = "0.10"
minicbor = { version = "0.25", features = ["std"] }
getrandom = "0.3"
zeroize = "1.8"
wasmtime = { version = "=47.0.3", default-features = false, features = ["cranelift", "runtime", "std", "wat"] }
wasmtime-wasi = { version = "=47.0.3", default-features = false, features = ["p1"] }
